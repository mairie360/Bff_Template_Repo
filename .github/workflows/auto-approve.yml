name: Auto Approve Renovate
on: pull_request_target

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    # Approve only when Renovate itself triggered the event: a push by anyone else on a Renovate
    # branch is not auto-approved.
    if: github.actor == 'renovate[bot]'
    # Least privilege: approving a PR only needs pull-requests: write.
    permissions:
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
