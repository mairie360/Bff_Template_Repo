# GDPR log marker stack (MAIR-290) for the BFF template: docker-compose-security.yml without ZAP,
# plus the `gdpr-marker` runner of mairie360/CICD (tests/gdpr/marker), which plays
# gdpr-marker.yaml with a marker user through the BFF. gdpr_marker_test.sh then searches the logs
# of every container (the BFF, its upstream APIs and BFFs, Postgres, Redis) for its values.
#
#   ./gdpr_marker_test.sh                    (local)
#   IMAGE_REF=<image> ./gdpr_marker_test.sh  (CI: the image promoted to staging)

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:1.3.0}
    container_name: bff-template-gdpr-db #change bff name
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:1.3.0}
    container_name: bff-template-gdpr-liquibase #change bff name
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: bff-template-gdpr-seeder #change bff name
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: bff-template-gdpr-redis #change bff name
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:1.2.0}
    container_name: bff-template-gdpr-core-api #change bff name
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Lift the API rate limit (MAIR-425): the journey hammers it as one user.
      RATE_LIMIT_ENABLED: "false"
      # mairie360_api_lib >= 2.0 refuses the well-known b"secret" without this flag. Throwaway test
      # stack only: a deployment uses a random secret of at least 32 bytes (MAIR-428).
      JWT_ALLOW_WEAK_SECRET: "true"
      EMAIL_FROM: "noreply.mairie360@test.local"
      SMTP_HOST: "localhost"
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core-api:3000
      # Every service of the stack shares this secret; the ZAP token below is signed with it.
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # The published image is distroless (no shell, no curl): its readiness is probed
    # from the core-api-ready container below.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: bff-template-gdpr-core-api-ready #change bff name
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  # Sessions are resolved by BFF User (GET /me): remove this service if the BFF does not call it.
  bff-user:
    image: ${BFF_USER_IMAGE:-ghcr.io/mairie360/bff-user:0.4.0}
    container_name: bff-template-gdpr-bff-user #change bff name
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: 'b"secret"'
      CORE_API_URL: http://core-api:3000
    expose:
      - "4000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  bff-template: #change bff name
    image: ${IMAGE_REF:-bff-template:local} #change bff name
    container_name: bff-template-gdpr-bff #change bff name
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
      bff-user:
        condition: service_healthy
    environment:
      HOST: "0.0.0.0"
      PORT: 4000 #change port
      JWT_SECRET: 'b"secret"'
      CORE_API_URL: http://core-api:3000
      USER_BFF_URL: http://bff-user:4000
    expose:
      - "4000" #change port
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"] #change port
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  gdpr-marker:
    image: node:24-bookworm-slim
    container_name: bff-template-gdpr-marker #change bff name
    user: "${GDPR_UID:-0}:${GDPR_GID:-0}"
    depends_on:
      bff-template: #change bff name
        condition: service_healthy
    environment:
      # Same static admin JWT as the ZAP scan of docker-compose-security.yml (sub=1, the seeded
      # Admin, role=admin, exp=2100, signed with the throwaway JWT_SECRET b"secret" of the stack).
      # Public test token of a throwaway stack, not a secret: allowed for Gitleaks.
      ADMIN_JWT: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwicm9sZSI6ImFkbWluIiwiZXhwIjo0MTAyNDQ0ODAwfQ.xCeBe_2QxRlXW8WXr3t6F69wbEHA93HbP_7l4OTJwjA # gitleaks:allow
    volumes:
      - ./cicd-repo/tests/gdpr:/engine:ro
      - ./gdpr-marker.yaml:/journey/gdpr-marker.yaml:ro
      - ./gdpr-report:/report
    command: ["/engine/marker/run.sh"]
    networks:
      - backend
