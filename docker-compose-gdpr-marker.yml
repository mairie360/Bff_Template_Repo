# GDPR log marker stack (MAIR-290) of the BFF template: the services of docker-compose-integration.yml
# (published Core API image, seeded database, Redis) plus the `gdpr-marker` runner of mairie360/CICD
# (tests/gdpr/marker), which plays gdpr-marker.yaml with a marker user through the BFF.
# gdpr_marker_test.sh then searches the logs of every container (the BFF, its upstream APIs, Postgres,
# Redis) for its values.
#
#   ./gdpr_marker_test.sh                    (local: builds bff-template:local from development.Dockerfile)
#   IMAGE_REF=<image> ./gdpr_marker_test.sh  (CI: the image promoted to staging)
#
# The database images are Database main's dev build carrying the GDPR schema. The session key pair
# and ADMIN_JWT come from stack_secrets.sh (fresh Ed25519 key pair per run, MAIR-428, MAIR-680).
#
# Template values: on the lines marked #change ..., replace `template` with the BFF name and 4000 with
# its port, and add the upstream APIs the BFF calls (with their bounded *-ready probe) next to core-api,
# exactly as in docker-compose-integration.yml.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:dev-c5b8e22}
    container_name: bff-template-gdpr-db #change bff name
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:dev-c5b8e22}
    container_name: bff-template-gdpr-liquibase #change bff name
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    container_name: bff-template-gdpr-seeder #change bff name
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    container_name: bff-template-gdpr-redis #change bff name
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:dev-3b40c2a}
    container_name: bff-template-gdpr-core-api #change bff name
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Lift the API rate limit (MAIR-425): the journey hammers it as one user.
      RATE_LIMIT_ENABLED: "false"
      # Core refuses to start without its Resend configuration (MAIR-522). No route of this BFF sends an
      # e-mail, so the key is fake and the URL never called (a BFF whose journeys read the e-mails Core
      # sends runs a WireMock fake Resend here instead, see BFF_user).
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core-api:3000
      # MAIR-680: Core alone signs the session JWTs (EdDSA) with this run's Ed25519 key pair from
      # stack_secrets.sh; no JWT_SECRET, so no HS256 token is accepted anywhere in the stack.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # The published image is distroless (no shell, no curl): its readiness is probed
    # from the core-api-ready container below.

  core-api-ready:
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    container_name: bff-template-gdpr-core-api-ready #change bff name
    depends_on:
      core-api:
        condition: service_started
    # Bounded (3 minutes): an API that never answers fails the stack instead of hanging the run.
    command: >
      sh -c 'for i in $$(seq 90); do
      if curl -fsS http://core-api:3000/health >/dev/null; then echo "core-api ready"; exit 0; fi;
      echo "waiting for core-api..."; sleep 2; done; echo "core-api not ready after 3 minutes"; exit 1'
    networks:
      - backend

  bff-template: #change bff name
    image: ${IMAGE_REF:-bff-template:local} #change bff name
    container_name: bff-template-gdpr-bff #change bff name
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"
      PORT: 4000 #change port
      # MAIR-680: Core's public key only, no JWT_SECRET: every HS256 token is refused.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      CORE_API_URL: http://core-api:3000
      # Add the other upstream URLs of the BFF here (PROJECT_API_URL: http://project-api:3001...).
    expose:
      - "4000" #change port
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"] #change port
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  gdpr-marker:
    image: node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    container_name: bff-template-gdpr-marker #change bff name
    user: "${GDPR_UID:-0}:${GDPR_GID:-0}"
    depends_on:
      bff-template: #change bff name
        condition: service_healthy
    environment:
      # Admin JWT of the run (sub=1, the seeded Admin), EdDSA, signed by stack_secrets.sh like Core.
      ADMIN_JWT: ${ADMIN_JWT:?ADMIN_JWT is generated by stack_secrets.sh, run gdpr_marker_test.sh}
    volumes:
      - ./cicd-repo/tests/gdpr:/engine:ro
      - ./gdpr-marker.yaml:/journey/gdpr-marker.yaml:ro
      - ./gdpr-report:/report
    command: ["/engine/marker/run.sh"]
    networks:
      - backend
