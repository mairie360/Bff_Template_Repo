# Integration test stack of the BFF (MAIR-262): the same upstream services as the ZAP / k6 stacks
# (published Core API image, seeded database, Redis) plus a `newman` runner that replays the committed
# Postman collection (tests/postman/) against the BFF over the compose network.
#
#   ./integration_test.sh                   (local: builds bff-template:local from development.Dockerfile)
#   IMAGE_REF=<image> ./integration_test.sh (CI: the dev-<sha> image published by release-dev)
#
# The BFF under test is never built by this file: it runs the image named by IMAGE_REF, the one
# promote-staging tests and then promotes by digest. `--bail` stops at the first failing request;
# the exit code of the newman service is what integration_test.sh returns.
#
# Template values: on the lines marked #change ..., replace `template` with the BFF name and 4000 with
# its port, and add the upstream APIs the BFF calls (with their *-ready probe) next to core-api, exactly
# as in docker-compose-security.yml. Since MAIR-525 a BFF calls the APIs only: no bff-user service here.
# Every API of the stack needs the same JWT_SECRET (random per run, stack_secrets.sh) and the env the
# security stack gives it (rate limits off, fake Resend for Core...).

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:3.3.0}
    container_name: bff-template-int-db #change bff name
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:3.3.0}
    container_name: bff-template-int-liquibase #change bff name
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: bff-template-int-seeder #change bff name
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: bff-template-int-redis #change bff name
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:2.2.0}
    container_name: bff-template-int-core-api #change bff name
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Lift the API rate limit (MAIR-425): the collection replays every route as the same two users.
      RATE_LIMIT_ENABLED: "false"
      # Core refuses to start without its Resend configuration (MAIR-522). No route of this BFF sends an
      # e-mail, so the key is fake and the URL never called (a BFF whose journeys read the e-mails Core
      # sends runs a WireMock fake Resend here instead, see BFF_user).
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core-api:3000
      # Every service of the stack shares this secret; the collection forges the JWTs of the seeded
      # accounts with it (collection-level pre-request script).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # The published image is distroless (no shell, no curl): its readiness is probed
    # from the core-api-ready container below.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: bff-template-int-core-api-ready #change bff name
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  bff-template: #change bff name
    image: ${IMAGE_REF:-bff-template:local} #change bff name
    container_name: bff-template-int-bff #change bff name
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"
      PORT: 4000 #change port
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
      CORE_API_URL: http://core-api:3000
      # Add the other upstream URLs of the BFF here (PROJECT_API_URL: http://project-api:3001...).
    expose:
      - "4000" #change port
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"] #change port
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Replays tests/postman/collection.json against the BFF service. `baseUrl` and the JWT_SECRET of the run
  # are injected here so the committed environment stays usable from a host shell; add one `--env-var`
  # per other service the collection reaches (a fake Resend journal, another API...). The reports
  # (junit) land in ./newman-reports (gitignored), read by the CI job summary.
  # The command is a folded scalar: a `#` inside it is part of the command, not a comment, so the
  # BFF name and port of its baseUrl are changed here. #change bff name #change port
  newman:
    image: postman/newman:6.1.3-alpine
    container_name: bff-template-int-newman #change bff name
    depends_on:
      bff-template: #change bff name
        condition: service_healthy
    volumes:
      - ./tests/postman:/etc/newman:ro
      - ./newman-reports:/reports
    command: >
      run /etc/newman/collection.json
      --environment /etc/newman/environment.json
      --env-var baseUrl=http://bff-template:4000
      --env-var jwt_secret=${JWT_SECRET}
      --bail
      --reporters cli,junit
      --reporter-junit-export /reports/newman.xml
    networks:
      - backend
