# Runs the BFF alone against a Core API reachable from the host (CORE_API_URL, default: the host's
# port 3000). Build with the GitHub Packages secrets:
#   NODE_AUTH_TOKEN=... docker compose up --build
# The full isolated stacks (database, Core API, BFF User...) are docker-compose-security.yml and
# docker-compose-performance.yml.
services:
  bff-{bff}: #change bff name
    build:
      context: .
      secrets:
        - npmrc
        - node_auth_token
    ports:
      - "{port}:{port}" #change port
    environment:
      PORT: {port} #change port
      CORE_API_URL: ${CORE_API_URL:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:{port}/health"] #change port
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  npmrc:
    file: ./.npmrc
  node_auth_token:
    environment: NODE_AUTH_TOKEN
